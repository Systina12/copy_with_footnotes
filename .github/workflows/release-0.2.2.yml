name: Publish 0.2.2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'Systina12/copy_with_footnotes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify release version
        run: |
          node -e 'const p = require("./package.json"); const m = require("./manifest.json"); const v = require("./versions.json"); if (p.version !== "0.2.2" || m.version !== p.version || v[p.version] !== m.minAppVersion) process.exit(1)'
      - name: Publish release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.2.2 >/dev/null 2>&1; then
            echo "0.2.2 is already released"
            exit 0
          fi
          gh release create 0.2.2 main.js manifest.json \
            --title "0.2.2" \
            --notes-file docs/release-0.2.2.md \
            --target "$GITHUB_SHA"
